name = "fitness-memory-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Plain (non-secret) settings, available as env.NAME in the code.
# PUBLIC_URL is this Worker's own address, used to build OAuth URLs and
# token audiences. Locally, .dev.vars overrides it with http://localhost:8799.
[vars]
PUBLIC_URL = "https://fitness-memory-worker.etucker-fitness-coach.workers.dev"
# The Pushcut widget that shows today's totals, and which of its contents
# to display (names as shown in the Pushcut app). The secret is PUSHCUT_SECRET.
PUSHCUT_WIDGET = "Calorie Tracker"
PUSHCUT_CONTENT = "Calories v2"

# Run scheduled() in src/index.js at 07:01 and 08:01 UTC. One of them is
# always 12:01 AM Pacific (crons are UTC and ignore daylight saving). Each run
# resets the phone widget to the new day's totals, and its Supabase reads also
# keep the free project from pausing after 7 idle days.
[triggers]
crons = ["1 7,8 * * *"]

# Storage for the OAuth provider (registered clients, grants, tokens).
# The code reaches it as env.OAUTH_KV.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b61d40865e4d4c9ea1226f0d26059562"

# Enable logging
[observability]
enabled = true
